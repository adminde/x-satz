# Settings of X-Satz, written in TOML.
# Copy this file to x-satz.conf in the folder you run xsatz from.
# Command line options win over the file.

[theme]
# Logo stamped into the title block and the running header of every PDF, PNG or SVG.
# A relative path counts from the folder of this file.
#logo = "path/to/logo.svg"

# Accent colour of the rules under title block and running header as #RRGGBB.
# Without it the rules take the accent colour of the logo.
#color = "#000000"

[output]
# Write MuseScore's file next to every PDF of render and parts, to open and check it in
# MuseScore. The options --mscz and --no-mscz win over it.
mscz = false

# Write every file of audio as MIDI as well. The options --midi and --no-midi win over it.
midi = false

[audio]
# Without this section every part plays as written, with MS Basic and without a count-in.
# These values suit a band whose brass read in C and play in B flat.

# Decibels the other parts play softer in a practice file. The default is 15.
softer = 21

# Share of every part sent to the reverb, from 0 to 1. MuseScore's default is 0.3.
#reverb = 0.3

# MuseScore's SoundFont directory. X-Satz writes shaped copies of SoundFonts there.
soundfont_dir = "~/Documents/MuseScore4/SoundFonts"

# A count-in "1 - 2 - 1 2 3 4" on a General MIDI drum key, here sticks.
[audio.count_in]
key = 31
dynamic = "f"

# Semitones added to the sounding pitch, by MusicXML instrument sound.
[audio.transpose.brass]
trumpet = -2
trombone = -2
euphonium = -2
tuba = -14

# Sounds of the MP3s by instrument sound. A family passes its keys except program on to its
# instruments. With swell every sample starts at that share of its level, with fade_in no
# sound fades in longer than that many seconds. The Sonatina Symphonic Orchestra has to be
# installed in the SoundFont folder first.
[audio.sounds.brass]
soundfont = "Sonatina_Symphonic_Orchestra"
swell = 0.5
fade_in = 0.01
trumpet.program = 27
trombone.program = 31
euphonium.program = 29
tuba.program = 34

# The sound of a single part, by part name. Here the trumpet section of Sonatina.
[audio.sounds.parts."Trompete 3"]
program = 28
